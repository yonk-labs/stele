services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stele-postgres
    environment:
      POSTGRES_USER: yonk
      POSTGRES_PASSWORD: yonk
      POSTGRES_DB: stele
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yonk -d stele"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - stele-postgres:/var/lib/postgresql/data

volumes:
  stele-postgres:

