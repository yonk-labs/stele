[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Distribution name: bare `stele` on PyPI is held by an inactive package
# (Open Law Library, v0.0.0, Nov 2022). Publishing as `stele-core`; the
# import name remains `stele`. PEP 541 reclaim of bare `stele` is a
# follow-up, not a blocker for first publish.
[project]
name = "stele-core"
version = "0.6.5"
description = "Sovereign, source-backed memory and living knowledge for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "lede>=0.4.5,<0.5",
  "mcp>=1.0,<2",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
mariadb = [
  "pymysql>=1.1,<2",
]
clickhouse = [
  "clickhouse-connect>=0.8,<1",
]
# Chunkshop 0.6.x — modular backends + search surface (0.5.0 hybrid search +
# summarize_hits) + connector platform / code understanding (0.6.0). [all-backends]
# == sqlite,mariadb,clickhouse; Postgres is core (psycopg[binary] is a core
# chunkshop dep), so there is NO [postgres] extra. Defaults are byte-identical to
# 0.4.x; the new search/memory surfaces are additive opt-ins.
chunkshop = [
  "chunkshop[all-backends]>=0.6.1,<0.7",
]
# pg-raggraph 0.5.0a17 — the Phase 5 living-knowledge consumer surface.
# Bumped from 0.4.0a1 onto the 0.5 line: xact-scoped advisory-lock bootstrap
# (multi-worker safe, no deadlock on a fresh DB) plus additive living_knowledge
# knobs (opt-in). All PGRGConfig kwargs stele's revisor passes survive the bump;
# the path is exercised by tests/integration/test_pg_raggraph_revisor.py.
# Defaults are byte-identical; the new knobs are opt-in. Owner-controlled, so
# the exact alpha is pinned.
# Independent of [postgres]: the graph projection reuses the Postgres
# artifact-backend DSN (no os.environ), but the dependency set is separate.
# pg-raggraph brings its own psycopg[binary]/psycopg-pool/pgvector.
postgres-graph = [
  "pg-raggraph==0.5.0a17",
]
judge = [
  "openai>=1.0,<2",
]
all-backends = [
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "clickhouse-connect>=0.8,<1",
]
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "mypy>=1.11",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "clickhouse-connect>=0.8,<1",
]

[project.scripts]
stele = "stele.cli:main"
stele-mcp = "stele.mcp.server:main"
stele-ingest = "stele.extraction.ingest:main"
stele-showcase = "benchmarks.showcase:main"
stele-recall = "benchmarks.recall:main"
stele-longrun = "benchmarks.longrun:main"
stele-answer-workflow = "benchmarks.answer_workflow:main"
stele-runtime-bench = "benchmarks.runtime:main"
stele-external-bench = "benchmarks.external.__main__:main"
stele-bulk-write-bench = "benchmarks.bulk_write:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stele", "benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"src/stele/packaging/templates" = "stele/packaging/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not e2e'"
markers = [
  "memory: memory backend contract tests",
  "e2e: full-stack end-to-end tests (deselected by default; CI opts in with -m e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stele"]

[[tool.mypy.overrides]]
module = [
  "yaml",
  "lede",
  "lede.*",
  "pymysql",
  "pymysql.cursors",
  "clickhouse_connect",
  "chunkshop.*",
  "pg_raggraph.*",
  "openai",
]
ignore_missing_imports = true
