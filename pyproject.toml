[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Distribution name: bare `stele` on PyPI is held by an inactive package
# (Open Law Library, v0.0.0, Nov 2022). Publishing as `stele-core`; the
# import name remains `stele`. PEP 541 reclaim of bare `stele` is a
# follow-up, not a blocker for first publish.
[project]
name = "stele-core"
version = "0.6.14"
description = "Sovereign, source-backed memory and living knowledge for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "lede>=0.4.5,<0.5",
  "mcp>=1.0,<2",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
mariadb = [
  "pymysql>=1.1,<2",
]
clickhouse = [
  "clickhouse-connect>=0.8,<1",
]
# Chunkshop 1.0.0-rc4 — code intelligence (10 tree-sitter languages, import-
# aware cross-file edges, scope_chain/provenance), symbol_aware path-less
# language detection (fixes stele:// URI ids: 0.6.x returned zero symbols for
# ~45% of .py / ~90% of .ts), read-pool default-on, generated/minified guard
# (max_symbols_per_file), whitespace-preserving fixed_overlap, and the
# code/search correctness fixes. API-compatible: every chunkshop symbol stele
# imports (load_chunker/load_embedder/load_sink/Document/FastembedEmbedder/
# FixedOverlapChunker/SentenceAwareChunker/parse_file/TargetConfig) resolves
# unchanged. [all-backends] == sqlite,mariadb,clickhouse; Postgres is core
# (psycopg[binary] is a core chunkshop dep), so there is NO [postgres] extra.
# stele's chunk_store uses Sink.query_top_k (not search_common), so the 0.9.0
# read-pool and 1.0.0-rc3 ef_search knobs are not on stele's search path;
# symbol_aware is not an exposed IndexingConfig.chunker (codeintel uses
# codeparse directly). Pinned at rc4: rc5 is dep-fix-only (lockfile/version,
# zero Python source changes) and unpublished. Owner-controlled, pre-release
# pinned deliberately.
chunkshop = [
  "chunkshop[all-backends]>=1.0.0-rc4,<1.1",
]
# pg-raggraph 0.9.2 — the Phase 5 living-knowledge consumer surface.
# Bumped from 0.5.0a17 across 0.7.0 (out of alpha, rrf-default fusion),
# 0.8.0 (entity-merge audit/security), 0.9.0 (ef_search self-scale,
# no_fuzzy_merge_types, defer_lexical_stats), 0.9.1 (hyphen-aware lexical
# tokenizer), 0.9.2 (graph_analyze API, lexical entity-seed leg, rel_type
# canonicalization). All PGRGConfig kwargs stele's revisor passes survive
# the bump; the query/ingest/supersede/retract/status/delete signatures are
# unchanged and the openai|ollama embedder still reads llm_base_url/llm_api_key
# (verified in 0.9.2 embedding.py). The path is exercised by
# tests/integration/test_pg_raggraph_revisor.py. stele defaults to
# mode="smart" (fusion-default flip is inert there); scores are not thresholded.
# Owner-controlled, so the exact version is pinned. Independent of [postgres]:
# the graph projection reuses the Postgres artifact-backend DSN (no os.environ),
# but the dependency set is separate. pg-raggraph brings its own
# psycopg[binary]/psycopg-pool/pgvector.
postgres-graph = [
  "pg-raggraph==0.9.2",
]
judge = [
  "openai>=1.0,<2",
]
# Code-intelligence sync layer (codeintel): a file watcher that keeps a
# content-hash manifest fresh. watchfiles (Rust/notify) gives cross-platform
# recursive watching + debounce; the manifest itself is stdlib sqlite3.
codeintel = [
  "watchfiles>=0.24,<2",
]
all-backends = [
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "clickhouse-connect>=0.8,<1",
]
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "mypy>=1.11",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "clickhouse-connect>=0.8,<1",
]

[project.scripts]
stele = "stele.cli:main"
stele-mcp = "stele.mcp.server:main"
stele-ingest = "stele.extraction.ingest:main"
stele-showcase = "benchmarks.showcase:main"
stele-recall = "benchmarks.recall:main"
stele-longrun = "benchmarks.longrun:main"
stele-answer-workflow = "benchmarks.answer_workflow:main"
stele-runtime-bench = "benchmarks.runtime:main"
stele-external-bench = "benchmarks.external.__main__:main"
stele-bulk-write-bench = "benchmarks.bulk_write:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stele", "benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"src/stele/packaging/templates" = "stele/packaging/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not e2e'"
markers = [
  "memory: memory backend contract tests",
  "e2e: full-stack end-to-end tests (deselected by default; CI opts in with -m e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stele"]

[[tool.mypy.overrides]]
module = [
  "yaml",
  "lede",
  "lede.*",
  "pymysql",
  "pymysql.cursors",
  "clickhouse_connect",
  "chunkshop.*",
  "pg_raggraph.*",
  "openai",
]
ignore_missing_imports = true
